[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-lab-backend"
version = "0.1.0"
description = "Verified periodic-signal experiments for an interactive learning lab"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["error"]
